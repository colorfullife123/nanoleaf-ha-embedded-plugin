name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Test GUI helper in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-runtime.ps1
      - name: Test startup update recovery in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-repair.ps1
      - name: Test hidden startup and on-demand task in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-startup.ps1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Failed = $true
              $Errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($Failed) { exit 1 }
